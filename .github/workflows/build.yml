name: build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      # בדיקות אוטומטיות: אם בדיקה נכשלת – הבנייה נעצרת (סימן אדום ב-GitHub)
      - name: Unit tests
        shell: bash
        run: dotnet test Tests/DeviceGuard.Tests.csproj -c Release
      - name: Publish light gate (NativeAOT)
        shell: bash
        continue-on-error: true
        run: dotnet publish Gate/DeviceGuardGate.csproj -c Release -r win-x64 -o Gate/out
      - name: Publish app
        shell: bash
        run: dotnet publish App/DeviceGuard.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=2.8.${{ github.run_number }} -o out
      # חתימה דיגיטלית (אופציונלית – מקטינה זיהוי שגוי של אנטי-וירוס). דורשת סודות: SIGN_PFX_BASE64 ו-SIGN_PFX_PASSWORD
      - name: Sign (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD out\DeviceGuard.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      # כישלון בהעלאה (למשל מכסת האחסון של Actions מלאה) לא עוצר את פרסום הגרסה; הקבצים נמחקים לבד אחרי 3 ימים
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: DeviceGuard
          path: out/DeviceGuard.exe
          retention-days: 3
      # מהדורה מפורסמת (לא טיוטה) בלשונית "Releases": בכל עדכון של main, בתגית v* או בהרצה ידנית. הקובץ להורדה: DeviceGuard.exe
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; else TAG="v2.8.${{ github.run_number }}"; fi
          gh release create "$TAG" out/DeviceGuard.exe --target "${{ github.sha }}" --title "אלף המגן $TAG" --generate-notes --latest
