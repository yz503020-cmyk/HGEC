name: build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish
        run: dotnet publish App/DeviceGuard.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=2.0.${{ github.run_number }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceGuard
          path: out/DeviceGuard.exe
      - name: Draft release (tag or manual)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then TAG="build-${{ github.run_number }}"; fi
          gh release create "$TAG" out/DeviceGuard.exe --draft --title "DeviceGuard $TAG" --generate-notes
